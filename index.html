<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BadCats</title>
<link rel="icon" href="img/logo.svg">
<link rel="stylesheet" href="style/main.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="img/logo.svg" alt="">BadCats</div>
  <nav id="nav" hidden></nav>
</header>
<main id="auth" class="card auth">
  <h1 data-i="welcome"></h1>
  <p data-i="welcome_sub" class="muted"></p>
  <input id="email" type="email" data-p="email" autocomplete="email">
  <input id="pass" type="password" data-p="password" autocomplete="current-password">
  <div class="row"><button id="login" data-i="login"></button><button id="register" class="ghost" data-i="register"></button></div>
  <p id="authMsg" class="msg"></p>
  <select class="lang" data-lang></select>
</main>
<main id="app" hidden></main>
<div id="toast"></div>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
